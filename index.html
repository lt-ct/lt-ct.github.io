<!DOCTYPE html>
<html>

<head>
<title>LT-CT</title>
<link rel="icon" href="./tot.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Gasoek+One&family=SN+Pro:wght@200..900&display=swap" rel="stylesheet">
<style>
h1 {
    font-family: "Gasoek One", sans-serif;
    z-index: 10;
    font-size: clamp(56px, 12vw, 72px);
    font-weight: 400;
    color: black;
    text-align: center;
    margin: 0.6em 0 0.3em;
}
h2 {
    font-family: "Gasoek One", sans-serif;
    z-index: 10;
    font-size: 40px;
    font-weight: 400;
    color: black;
    text-align: center;
}
h3 {
    font-family: "Gasoek One", sans-serif;
    z-index: 10;
    font-size: 20px;
    font-weight: 400;
    color: black;
    text-align: center;
}

body {
    background-color: rgb(225, 225, 225);
}

/*
  Flex-wrap keeps the buttons centered as a group regardless of how
  many there are (unlike CSS grid with a fixed column count, which
  reserves empty tracks for missing items and throws off centering).
  Wrapping to a new row happens naturally once items no longer fit,
  and because the media query below flips button size + container
  width together at 800px, there's no in-between zone where 2 buttons
  end up sharing a row — it's always 3 or 1.
*/
.grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 55px;
  padding: 65px 90px;
  max-width: 1100px;
  margin: 0 auto;
}

.grid a {
  text-decoration: none;
}

/*
  Every button is a square. Width uses clamp() so it scales down
  smoothly as the viewport narrows (down to a sensible floor) while
  never exceeding its max size on big screens. To add a new button,
  copy an <a><button class="button">...</button></a> block below —
  no other changes needed, the flex layout handles positioning.
*/
.button {
  width: clamp(140px, 18vw, 195px);
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Pixelify Sans", sans-serif;
  color: black;
  background-color: transparent;
  border: none;
  padding: 0;
  cursor: pointer;
}

.button img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/*
  Basic "scheduler" look: a few horizontal lines standing in for
  a planner grid, with the label sitting on top of them.
*/
.scheduler-button {
  position: relative;
  background-color: white;
  border: 3px solid black;
  overflow: hidden;
}

.scheduler-lines {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  padding: 18px 0;
}

.scheduler-lines span {
  display: block;
  height: 3px;
  margin: 0 18px;
  background-color: #ccc;
}

.scheduler-text {
  position: relative;
  z-index: 2;
  font-family: "SN Pro", sans-serif;
  text-transform: lowercase;
  font-weight: bold;
  font-size: 21px;
  color: black;
  text-align: center;
  padding: 0 12px;
  line-height: 1.3;
}

/*
  Plain white box with centered text — used for buttons that
  don't have their own icon/graphic yet.
*/
.plain-button {
  background-color: white;
  border: 3px solid black;
}

/*
  Below this width there isn't room for 3 columns without them
  getting cramped, so we snap straight to 1 column and scale
  everything up a bit for a better mobile feel.
*/
@media (max-width: 800px) {
  .grid {
    gap: 30px;
    padding: 30px 35px;
  }

  .button {
    width: clamp(190px, 65vw, 260px);
  }

  .scheduler-text {
    font-size: 26px;
  }

  h2 {
    font-size: 32px;
  }

  h3 {
    font-size: 18px;
  }
}
</style>
</head>

<body>
    <h1>LT-CT</h1>
    <div class="grid">
      <!--<a href="#">
        <button class="button plain-button">
          <span class="scheduler-text">coming soon</span>
        </button>
      </a>-->
      <a href="scheduler.html">
        <button class="button scheduler-button">
          <div class="scheduler-lines">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <span class="scheduler-text">school<br>scheduler</span>
        </button>
      </a>
      <!--<a href="#">
        <button class="button plain-button">
          <span class="scheduler-text">coming soon</span>
        </button>
      </a>-->
    </div>
</body>

</html>
